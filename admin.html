<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parsa Restaurant — Admin Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --bg-card: #12141a;
            --gold: #d4af37;
            --gold-light: #f3e5ab;
            --text-light: #f8f6f0;
            --text-muted: #8a8880;
            --border: rgba(212, 175, 55, 0.2);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-light);
            padding: 2rem;
            min-height: 100vh;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
            margin-bottom: 2rem;
        }
        .admin-title {
            font-size: 1.8rem;
            color: var(--gold-light);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.25rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.25rem;
        }
        .stat-num {
            font-size: 2rem;
            font-weight: 700;
            color: var(--gold);
            margin-top: 0.25rem;
        }
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th, td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        th {
            background: rgba(212, 175, 55, 0.08);
            color: var(--gold-light);
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        .code-badge {
            background: rgba(212, 175, 55, 0.15);
            color: var(--gold);
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-weight: 700;
            font-size: 0.85rem;
        }
        .btn {
            background: var(--gold);
            color: #000;
            border: none;
            padding: 0.6rem 1.25rem;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-outline {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
        }
    </style>
</head>
<body>

<div class="admin-header">
    <div class="admin-title">
        👑 Parsa Restaurant — Admin Dashboard
    </div>
    <div>
        <a href="/" class="btn btn-outline">← Back to Main Website</a>
        <button class="btn" onclick="exportCSV()">Export to CSV</button>
    </div>
</div>

<div class="stats-grid">
    <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.85rem;">Total Bookings</div>
        <div class="stat-num" id="stat-total">0</div>
    </div>
    <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.85rem;">Total Guests</div>
        <div class="stat-num" id="stat-guests">0</div>
    </div>
    <div class="stat-card">
        <div style="color: var(--text-muted); font-size: 0.85rem;">Status</div>
        <div class="stat-num" style="color: #46b450; font-size: 1.3rem;">● Live & Ready</div>
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th>Booking Code</th>
                <th>Guest Name</th>
                <th>Date & Time</th>
                <th>Guests</th>
                <th>Seating Area</th>
                <th>Phone</th>
                <th>Email</th>
                <th>Notes</th>
            </tr>
        </thead>
        <tbody id="reservations-table-body">
            <tr>
                <td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2rem;">Loading reservations...</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function loadReservations() {
        const tbody = document.getElementById('reservations-table-body');
        const reservations = JSON.parse(localStorage.getItem('parsa_reservations') || '[]');
        
        document.getElementById('stat-total').textContent = reservations.length;
        let totalGuests = 0;
        reservations.forEach(r => totalGuests += parseInt(r.guests || 2));
        document.getElementById('stat-guests').textContent = totalGuests;

        if (reservations.length === 0) {
            tbody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: var(--text-muted); padding: 2.5rem;">No reservations booked yet. Form submissions will appear here in real time.</td></tr>';
            return;
        }

        tbody.innerHTML = reservations.map(r => `
            <tr>
                <td><span class="code-badge">${r.code || 'PARSA-001'}</span></td>
                <td><strong>${r.name || 'Guest'}</strong></td>
                <td>${r.date || ''} @ ${r.time || ''}</td>
                <td>${r.guests || 2} People</td>
                <td>${r.seating || 'Main Dining Room'}</td>
                <td>${r.phone || '-'}</td>
                <td>${r.email || '-'}</td>
                <td><small style="color: var(--text-muted);">${r.notes || 'None'}</small></td>
            </tr>
        `).join('');
    }

    function exportCSV() {
        const reservations = JSON.parse(localStorage.getItem('parsa_reservations') || '[]');
        if (reservations.length === 0) { alert('No reservations to export yet.'); return; }
        
        let csv = 'Code,Name,Email,Phone,Date,Time,Guests,Seating,Notes\n';
        reservations.forEach(r => {
            csv += `"${r.code}","${r.name}","${r.email}","${r.phone}","${r.date}","${r.time}","${r.guests}","${r.seating}","${r.notes || ''}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'parsa_reservations.csv';
        a.click();
    }

    window.onload = loadReservations;
</script>

</body>
</html>
